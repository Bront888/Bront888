<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="title desc">
<title id="title">BRONTIS animated technology footer</title>
<desc id="desc">A large floating holographic globe with orbiting healthcare and technology particles.</desc>
<defs>
 <radialGradient id="space"><stop stop-color="#10265c" stop-opacity=".9"/><stop offset="1" stop-color="#02040d" stop-opacity="0"/></radialGradient>
 <linearGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1200" height="260" fill="#02040d"/>
<ellipse cx="600" cy="135" rx="430" ry="125" fill="url(#space)"/>
<!-- large floating globe -->
<g transform="translate(600 132)">
 <circle r="82" fill="#071633" stroke="#22d3ee" stroke-width="2" opacity=".9"/>
 <ellipse rx="82" ry="30" fill="none" stroke="#38bdf8" opacity=".55"/>
 <ellipse rx="82" ry="58" fill="none" stroke="#38bdf8" opacity=".35"/>
 <ellipse rx="30" ry="82" fill="none" stroke="#67e8f9" opacity=".5"/>
 <ellipse rx="58" ry="82" fill="none" stroke="#22d3ee" opacity=".3"/>
 <path d="M-78 0H78M-55-58Q0-25 55-58M-55 58Q0 25 55 58" fill="none" stroke="#38bdf8" opacity=".45"/>
 <circle r="92" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".35">
  <animate attributeName="r" values="88;108;88" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".5;0;.5" dur="4s" repeatCount="indefinite"/>
 </circle>
</g>
<!-- orbit rings -->
<g fill="none" stroke="url(#cyan)" stroke-width="2">
 <ellipse cx="600" cy="132" rx="260" ry="62" transform="rotate(-10 600 132)" opacity=".7"/>
 <ellipse cx="600" cy="132" rx="350" ry="88" transform="rotate(8 600 132)" opacity=".35"/>
</g>
<!-- large floating nodes -->
<g>
 <circle cx="342" cy="102" r="11" fill="#22d3ee" filter="url(#glow)" opacity=".8"/>
 <circle cx="342" cy="102" r="6" fill="#67e8f9"><animate attributeName="r" values="5;10;5" dur="2.5s" repeatCount="indefinite"/></circle>
 <circle cx="865" cy="72" r="12" fill="#6366f1" filter="url(#glow)" opacity=".7"/>
 <circle cx="865" cy="72" r="6" fill="#a5b4fc"><animate attributeName="r" values="5;10;5" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="925" cy="190" r="9" fill="#22d3ee"><animate attributeName="cy" values="190;165;190" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="275" cy="185" r="8" fill="#38bdf8"><animate attributeName="cy" values="185;155;185" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="5s" repeatCount="indefinite"/></circle>
</g>
<!-- floating medical/AI symbols -->
<g fill="#67e8f9" opacity=".9">
 <g transform="translate(185 88)"><circle r="24" fill="#071633" stroke="#22d3ee"/><path d="M-10 0H10M0-10V10" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></path></g>
 <g transform="translate(1015 95)"><circle r="26" fill="#071633" stroke="#6366f1"/><path d="M-12 0L-4-9L4 9L12 0" fill="none" stroke="#a5b4fc" stroke-width="3"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></path></g>
</g>
<!-- drifting particles -->
<g fill="#22d3ee">
 <circle cx="430" cy="48" r="4"><animate attributeName="cy" values="48;25;48" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="220" r="4"><animate attributeName="cy" values="220;195;220" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="1100" cy="155" r="3"><animate attributeName="cy" values="155;125;155" dur="4.5s" repeatCount="indefinite"/></circle>
 <circle cx="105" cy="160" r="3"><animate attributeName="cy" values="160;130;160" dur="5.5s" repeatCount="indefinite"/></circle>
</g>
<text x="600" y="245" text-anchor="middle" fill="#334e7d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="4">CONNECTING IDEAS • BUILDING IMPACT • EVERY LIFE WITHIN REACH</text>
</svg>