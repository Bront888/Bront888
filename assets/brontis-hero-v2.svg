<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
<title id="title">BRONTIS — Building technology for a more connected future</title>
<desc id="desc">Animated dark futuristic technology banner with deliberately large floating healthcare and AI elements.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030511"/><stop offset=".55" stop-color="#091633"/><stop offset="1" stop-color="#02030a"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8b4fe"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<ellipse cx="930" cy="170" rx="350" ry="175" fill="#2563eb" opacity=".15" filter="url(#blur)"><animate attributeName="opacity" values=".08;.22;.08" dur="6s" repeatCount="indefinite"/></ellipse>

<!-- LARGE, OBVIOUS FLOATING ELEMENTS -->
<g>
 <!-- oversized cyan orb -->
 <circle cx="735" cy="62" r="28" fill="#22d3ee" opacity=".22" filter="url(#glow)"/>
 <circle cx="735" cy="62" r="17" fill="#22d3ee"><animate attributeName="cy" values="62;35;62" dur="5s" repeatCount="indefinite"/><animate attributeName="r" values="15;21;15" dur="5s" repeatCount="indefinite"/></circle>
 <!-- oversized purple orb -->
 <circle cx="1100" cy="78" r="38" fill="#8b5cf6" opacity=".22" filter="url(#glow)"/>
 <circle cx="1100" cy="78" r="24" fill="url(#purple)"><animate attributeName="cy" values="78;112;78" dur="6s" repeatCount="indefinite"/><animate attributeName="r" values="21;28;21" dur="6s" repeatCount="indefinite"/></circle>
 <!-- oversized medical cross -->
 <g transform="translate(1060 258)">
  <circle r="52" fill="#0ea5e9" opacity=".13" filter="url(#glow)"/>
  <circle r="39" fill="none" stroke="#38bdf8" stroke-width="3" opacity=".8"><animate attributeName="r" values="34;48;34" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;.95;.35" dur="4.5s" repeatCount="indefinite"/></circle>
  <path d="M-11-27H11V-11H27V11H11V27H-11V11H-27V-11H-11Z" fill="#67e8f9" opacity=".85"/>
  <animateTransform attributeName="transform" type="translate" values="1060 258;1060 232;1060 258" dur="7s" repeatCount="indefinite"/>
 </g>
 <!-- oversized capsule -->
 <g transform="translate(905 62) rotate(-28)">
  <rect x="-18" y="-45" width="36" height="90" rx="18" fill="none" stroke="#67e8f9" stroke-width="4"/>
  <path d="M-18 0H18" stroke="#67e8f9" stroke-width="4"/>
  <path d="M-18-18H18V-27A18 18 0 0 0-18-27Z" fill="#38bdf8" opacity=".5"/>
  <animateTransform attributeName="transform" type="translate" values="905 62;925 88;905 62" dur="8s" repeatCount="indefinite"/>
 </g>
 <!-- oversized purple floating sphere -->
 <g>
  <circle cx="680" cy="292" r="31" fill="url(#purple)" opacity=".9"/>
  <circle cx="670" cy="281" r="10" fill="#fff" opacity=".22"/>
  <circle cx="680" cy="292" r="44" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".45"><animate attributeName="r" values="35;52;35" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;.08;.6" dur="5s" repeatCount="indefinite"/></circle>
  <animateTransform attributeName="transform" type="translate" values="0 0;15 -20;0 0" dur="7s" repeatCount="indefinite"/>
 </g>
 <!-- large orbiting data ring -->
 <g fill="none" stroke="#22d3ee">
  <ellipse cx="790" cy="286" rx="68" ry="28" stroke-width="2.5" opacity=".6" transform="rotate(-18 790 286)"/>
  <circle cx="850" cy="265" r="11" fill="#67e8f9" stroke="none"><animate attributeName="cx" values="850;730;850" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="265;307;265" dur="5s" repeatCount="indefinite"/></circle>
 </g>
</g>

<!-- network -->
<g fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity=".58">
 <path d="M700 125L790 160L900 115L1015 155L1135 125"/><path d="M720 205L820 165L930 225L1040 190L1145 235"/><path d="M760 310L850 255L955 305L1080 270"/><path d="M790 160L820 165L850 255"/><path d="M900 115L930 225L955 305"/>
</g>
<g fill="#67e8f9">
 <circle cx="700" cy="125" r="7"><animate attributeName="r" values="5;10;5" dur="2.5s" repeatCount="indefinite"/></circle>
 <circle cx="790" cy="160" r="8"><animate attributeName="r" values="6;12;6" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="900" cy="115" r="7"><animate attributeName="r" values="5;10;5" dur="2.7s" repeatCount="indefinite"/></circle>
 <circle cx="930" cy="225" r="8"><animate attributeName="r" values="6;12;6" dur="3.4s" repeatCount="indefinite"/></circle>
 <circle cx="1040" cy="190" r="7"><animate attributeName="r" values="5;10;5" dur="2.8s" repeatCount="indefinite"/></circle>
</g>

<!-- central healthcare signal -->
<circle cx="850" cy="180" r="55" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity=".38"><animate attributeName="r" values="44;82;44" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="180" r="39" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="0 850 180" to="360 850 180" dur="11s" repeatCount="indefinite"/></circle>
<path d="M850 149v62M819 180h62" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" opacity=".85"/>

<!-- foreground typography -->
<text x="90" y="135" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="8">BRONTIS</text>
<text x="94" y="182" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="2">SOFTWARE • AI • HEALTH-TECH</text>
<text x="94" y="225" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Building technology for a more connected future.</text>
<text x="94" y="264" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="1">BUILDING SYSTEMS THAT MATTER.</text>
<path d="M90 286H620" stroke="#1e3a8a" stroke-width="1"/>
<path d="M90 286H500" stroke="#38bdf8" stroke-width="2" opacity=".7"><animate attributeName="x2" values="250;620;250" dur="5s" repeatCount="indefinite"/></path>
</svg>