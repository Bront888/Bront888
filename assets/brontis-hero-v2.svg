<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
<title id="title">BRONTIS — Build, Learn, Create, Impact</title>
<desc id="desc">Clean BRONTIS personal brand banner featuring the geometric B monogram, BRONTIS wordmark, and the values Build, Learn, Create, Impact.</desc>
<defs>
  <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B63F6"/>
    <stop offset="1" stop-color="#22C7F2"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071A3D"/>
    <stop offset="1" stop-color="#020B1E"/>
  </linearGradient>
</defs>

<rect width="1200" height="360" rx="24" fill="url(#bg)"/>

<!-- restrained ambient glow -->
<circle cx="1020" cy="80" r="150" fill="#0B63F6" opacity=".08"/>
<circle cx="1120" cy="300" r="120" fill="#22C7F2" opacity=".06"/>

<!-- BRONTIS monogram -->
<g transform="translate(94 82)">
  <path d="M0 0H105C139 0 161 22 161 54C161 79 148 96 126 104C148 112 163 130 163 157C163 190 140 212 105 212H0V151L52 99L0 47V0Z" fill="url(#mark)"/>
  <path d="M52 47H110C124 47 133 54 133 66C133 78 124 85 110 85H67L52 70V47Z" fill="#071A3D"/>
  <path d="M67 105H111C126 105 136 113 136 126C136 139 126 147 111 147H91L67 123V105Z" fill="#071A3D"/>
  <path d="M0 69L52 121V176L0 212V69Z" fill="#0B63F6"/>
</g>

<!-- wordmark -->
<text x="300" y="154" fill="#FFFFFF" font-family="Manrope,Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="7">BRONTIS</text>
<text x="304" y="198" fill="#B8C7E3" font-family="Manrope,Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="4">BUILD  |  LEARN  |  CREATE  |  IMPACT</text>

<path d="M304 232H830" stroke="#1C315C" stroke-width="2"/>
<path d="M304 232H585" stroke="url(#mark)" stroke-width="3"/>

<text x="304" y="272" fill="#8EA2C4" font-family="Manrope,Inter,Segoe UI,Arial,sans-serif" font-size="17">Software • AI • Product Engineering • Health-Tech</text>
<text x="304" y="306" fill="#FFFFFF" font-family="Manrope,Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">A BETTER ME. A GREATER TOMORROW.</text>

<!-- subtle signature accent -->
<path d="M985 306C1040 290 1086 290 1135 306" fill="none" stroke="#22C7F2" stroke-width="3" stroke-linecap="round" opacity=".75"/>
</svg>