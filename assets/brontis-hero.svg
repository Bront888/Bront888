<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">BRONTIS — Building technology for a more connected future</title>
  <desc id="desc">Animated dark futuristic technology banner with drifting network nodes, pulsing signals, and healthcare-inspired geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#0a1230"/><stop offset="1" stop-color="#02040d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity=".95"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <ellipse cx="870" cy="175" rx="330" ry="150" fill="#2563eb" opacity=".13" filter="url(#blur)">
    <animate attributeName="opacity" values=".08;.18;.08" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1040" cy="270" rx="190" ry="100" fill="#06b6d4" opacity=".10" filter="url(#blur)">
    <animate attributeName="opacity" values=".06;.15;.06" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="url(#glow)" stroke-width="1.5" opacity=".62">
    <path d="M720 70 L850 140 L1010 80 L1160 155"/>
    <path d="M690 210 L830 155 L970 235 L1130 190"/>
    <path d="M760 310 L850 220 L1030 300 L1180 250"/>
    <path d="M850 140 L830 155 L850 220"/>
    <path d="M1010 80 L970 235 L1030 300"/>
    <path d="M720 70 L690 210 L760 310"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="720" cy="70" r="4"><animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="140" r="5"><animate attributeName="r" values="4;8;4" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;1;.5" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="80" r="4"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="155" r="5"><animate attributeName="r" values="4;8;4" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;1;.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="235" r="4"><animate attributeName="r" values="3;7;3" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="300" r="5"><animate attributeName="r" values="4;8;4" dur="3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;1;.5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="190" r="4"><animate attributeName="r" values="3;7;3" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;1;.45" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <circle cx="850" cy="180" r="62" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".24">
      <animate attributeName="r" values="48;78;48" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".42;0;.42" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="180" r="42" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".42">
      <animateTransform attributeName="transform" type="rotate" from="0 850 180" to="360 850 180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <path d="M850 146 v68 M816 180 h68" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  </g>
  <g opacity=".8">
    <circle cx="700" cy="118" r="3" fill="#38bdf8"><animate attributeName="cy" values="118;92;118" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="125" r="3" fill="#22d3ee"><animate attributeName="cy" values="125;98;125" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="270" r="2.5" fill="#67e8f9"><animate attributeName="cy" values="270;240;270" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="270" r="2.5" fill="#38bdf8"><animate attributeName="cy" values="270;242;270" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M90 286 H620" stroke="#1e3a8a" stroke-width="1"/>
  <path d="M90 286 H500" stroke="#38bdf8" stroke-width="2" opacity=".65">
    <animate attributeName="x2" values="260;620;260" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="90" y="135" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="8">BRONTIS</text>
  <text x="94" y="182" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="2">SOFTWARE • AI • HEALTH-TECH</text>
  <text x="94" y="225" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Building technology for a more connected future.</text>
  <text x="94" y="264" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="1">BUILDING SYSTEMS THAT MATTER.</text>
</svg>